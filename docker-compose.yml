services:
  db:
    image: postgres:16-alpine
    container_name: boaztask-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: boaztask
      POSTGRES_USER: boaztask
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boaztask_secure_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - boaztask-net

  backend:
    build: ./backend
    container_name: boaztask-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://boaztask:${DB_PASSWORD:-boaztask_secure_2024}@db:5432/boaztask
      AUTH_DB_PATH: /data/auth.db
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_EMERGENCY_TOKEN: ${AUTH_EMERGENCY_TOKEN:-}
      AUTH_SUPER_ADMIN_EMAIL: ${AUTH_SUPER_ADMIN_EMAIL:-boazen@gmail.com}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-https://task.newavera.co.il/auth/callback}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
    volumes:
      - auth_data:/data
    depends_on:
      - db
    networks:
      - boaztask-net

  # telegram-bot service intentionally removed — bridging is now done by the
  # external "ran" agent via /api with bearer tokens. The bot code under
  # backend/app/telegram_bot.py + run_bot.py is kept dormant for reference,
  # and TELEGRAM_BOT_TOKEN in .env stays put so we can revive the service
  # later by restoring this block (and the bot-only deps in requirements.txt).

  frontend:
    build: ./frontend
    container_name: boaztask-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend
    networks:
      - boaztask-net

volumes:
  postgres_data:
  auth_data:

networks:
  boaztask-net:
    driver: bridge
