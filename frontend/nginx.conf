server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so nginx re-resolves backend's IP when it changes
    resolver 127.0.0.11 valid=10s;

    # Backend upstream as a variable so nginx defers DNS resolution to runtime
    set $backend_upstream "http://backend:8000";

    # Reusable proxy header set for all backend locations
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $backend_upstream;
    }

    # shared-auth endpoints (Google OAuth login/callback, session, user mgmt)
    location = /login           { proxy_pass $backend_upstream; }
    location = /logout          { proxy_pass $backend_upstream; }
    location = /no-access       { proxy_pass $backend_upstream; }
    location = /emergency-login { proxy_pass $backend_upstream; }
    location /auth/             { proxy_pass $backend_upstream; }

    # SPA fallback for everything else (must come last)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
